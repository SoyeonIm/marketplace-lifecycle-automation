  <text x="48" y="76" fill="#647383" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Every exclusion is applied before assignment; percentages use all 12,000 members as the denominator.</text>
