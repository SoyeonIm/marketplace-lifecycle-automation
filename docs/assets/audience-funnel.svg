    <text x="1018" y="504" fill="#17212b" font-size="14" font-weight="700">4,051</text>
    <text x="1101" y="504" fill="#647383" font-size="13">33.8%</text></g>
  <rect x="48" y="538" width="1104" height="1" fill="#dce5eb"/>
