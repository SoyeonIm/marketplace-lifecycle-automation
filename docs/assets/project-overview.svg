<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace lifecycle automation project overview</title>
  <desc id="desc">Five stages connect product events to a governed audience, randomized experiment, causal outcome and staged rollout decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#063e69"/><stop offset="0.66" stop-color="#087ec7"/><stop offset="1" stop-color="#075f9e"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7fc5eb"/></marker>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="24" r="220" fill="#f6a800" opacity="0.10"/>
  <text x="48" y="62" fill="#f9c548" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">END-TO-END LIFECYCLE ANALYTICS</text>
  <text x="48" y="106" fill="#ffffff" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="35" font-weight="750">From product signals to a governed growth decision</text>
  <text x="48" y="137" fill="#dbeefa" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Synthetic marketplace data · reproducible SQL pipeline · 26/26 quality and campaign-safety checks</text>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(48 172)">
      <rect width="202" height="142" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="20" y="31" fill="#a9d8f3" font-size="12" font-weight="700" letter-spacing="1.2">01 · SIGNALS</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="750">96,500</text>
      <text x="20" y="108" fill="#dbeefa" font-size="14">product events</text>
    </g><path d="M 255 243 H 269" stroke="#7fc5eb" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(274 172)">
      <rect width="202" height="142" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="20" y="31" fill="#a9d8f3" font-size="12" font-weight="700" letter-spacing="1.2">02 · GOVERNANCE</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="750">4,051</text>
      <text x="20" y="108" fill="#dbeefa" font-size="14">eligible members</text>
    </g><path d="M 481 243 H 495" stroke="#7fc5eb" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(500 172)">
      <rect width="202" height="142" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="20" y="31" fill="#a9d8f3" font-size="12" font-weight="700" letter-spacing="1.2">03 · EXPERIMENT</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="750">3 arms</text>
      <text x="20" y="108" fill="#dbeefa" font-size="14">randomized design</text>
    </g><path d="M 707 243 H 721" stroke="#7fc5eb" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(726 172)">
      <rect width="202" height="142" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="20" y="31" fill="#a9d8f3" font-size="12" font-weight="700" letter-spacing="1.2">04 · OUTCOME</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="750">+3.41 pp</text>
      <text x="20" y="108" fill="#dbeefa" font-size="14">incremental conversion</text>
    </g><path d="M 933 243 H 947" stroke="#7fc5eb" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(952 172)">
      <rect width="202" height="142" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="20" y="31" fill="#a9d8f3" font-size="12" font-weight="700" letter-spacing="1.2">05 · DECISION</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="750">50% staged</text>
      <text x="20" y="108" fill="#dbeefa" font-size="14">rollout + 10% holdout</text>
    </g></g>
  <text x="48" y="354" fill="#dbeefa" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Primary outcome: 14-day listing creation · Guardrail: unsubscribe ≤ 1% · Estimand: intention-to-treat uplift</text>
</svg>
