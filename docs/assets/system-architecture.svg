<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Production-oriented lifecycle analytics architecture</title>
  <desc id="desc">Data flows from product events and consent through Snowflake and dbt, then Hightouch and Braze, before experiment measurement and decision reporting.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087ec7"/></marker></defs>
  <rect width="1200" height="500" rx="20" fill="#ffffff"/>
  <text x="48" y="46" fill="#17212b" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="750">Warehouse-to-activation architecture</text>
  <text x="48" y="72" fill="#647383" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Local execution uses SQLite; the documented production boundary maps the same contracts to Snowflake, dbt, Hightouch and Braze.</text>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(48 82)">
      <rect width="258" height="338" rx="18" fill="#e9f4fb" stroke="#dce5eb"/>
      <text x="18" y="34" fill="#075f9e" font-size="11" font-weight="750" letter-spacing="0.9">COLLECTION &amp; IDENTITY</text>

      <rect x="18" y="70" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="97" fill="#17212b" font-size="14" font-weight="700">Product events</text>
      <text x="34" y="118" fill="#647383" font-size="12">Segment / GA4</text>
      <rect x="18" y="158" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="185" fill="#17212b" font-size="14" font-weight="700">Consent history</text>
      <text x="34" y="206" fill="#647383" font-size="12">Preference centre</text>
    </g>
    <g transform="translate(330 82)">
      <rect width="258" height="338" rx="18" fill="#eef2f5" stroke="#dce5eb"/>
      <text x="18" y="34" fill="#075f9e" font-size="11" font-weight="750" letter-spacing="0.9">MODELLING &amp; GOVERNANCE</text>

      <rect x="18" y="70" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="97" fill="#17212b" font-size="14" font-weight="700">Snowflake raw</text>
      <text x="34" y="118" fill="#647383" font-size="12">source contracts</text>
      <rect x="18" y="158" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="185" fill="#17212b" font-size="14" font-weight="700">dbt marts</text>
      <text x="34" y="206" fill="#647383" font-size="12">Member 360 + audience</text>
      <rect x="18" y="246" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="273" fill="#17212b" font-size="14" font-weight="700">Quality gates</text>
      <text x="34" y="294" fill="#647383" font-size="12">freshness + safety</text>
    </g>
    <g transform="translate(612 82)">
      <rect width="258" height="338" rx="18" fill="#fff5dd" stroke="#dce5eb"/>
      <text x="18" y="34" fill="#075f9e" font-size="11" font-weight="750" letter-spacing="0.9">ACTIVATION</text>

      <rect x="18" y="70" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="97" fill="#17212b" font-size="14" font-weight="700">Hightouch</text>
      <text x="34" y="118" fill="#647383" font-size="12">audience sync</text>
      <rect x="18" y="158" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="185" fill="#17212b" font-size="14" font-weight="700">Braze Canvas</text>
      <text x="34" y="206" fill="#647383" font-size="12">control + treatments</text>
    </g>
    <g transform="translate(894 82)">
      <rect width="258" height="338" rx="18" fill="#e8f5ef" stroke="#dce5eb"/>
      <text x="18" y="34" fill="#075f9e" font-size="11" font-weight="750" letter-spacing="0.9">MEASUREMENT</text>

      <rect x="18" y="70" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="97" fill="#17212b" font-size="14" font-weight="700">Outcome mart</text>
      <text x="34" y="118" fill="#647383" font-size="12">14-day listings</text>
      <rect x="18" y="158" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="185" fill="#17212b" font-size="14" font-weight="700">Experiment analysis</text>
      <text x="34" y="206" fill="#647383" font-size="12">uplift + guardrails</text>
      <rect x="18" y="246" width="226" height="66" rx="12" fill="#ffffff" stroke="#dce5eb"/>
      <text x="34" y="273" fill="#17212b" font-size="14" font-weight="700">Decision report</text>
      <text x="34" y="294" fill="#647383" font-size="12">rollout policy</text>
    </g><path d="M 306 256 H 336" stroke="#087ec7" stroke-width="3" marker-end="url(#arrow)"/><path d="M 588 256 H 618" stroke="#087ec7" stroke-width="3" marker-end="url(#arrow)"/><path d="M 870 256 H 900" stroke="#087ec7" stroke-width="3" marker-end="url(#arrow)"/></g>
  <text x="48" y="468" fill="#647383" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Ownership is explicit: analytics defines semantics, engineering operates models, lifecycle owns the journey, and Privacy approves policy.</text>
</svg>
